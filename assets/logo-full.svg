<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" role="img" aria-label="Heroes Home Network logo">

  <defs>
    <linearGradient id="mtnf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa4ad"/><stop offset="1" stop-color="#77828c"/>
    </linearGradient>
  </defs>
  <!-- mountains (behind roof) -->
  <g>
    <path d="M455 372 530 160l6 44 34-70 56 118 20-40 34 88 6 72z" fill="url(#mtnf)"/>
    <path d="M570 134l16 34-16 8-14-12zM650 212l10 22-12 6-8-9z" fill="#e9edf1"/>
    <path d="M480 372l52-80 48 80z" fill="#8a949e"/>
    <path d="M532 292l11 17-11 6-10-7z" fill="#e9edf1"/>
    <path d="M600 372v-20l-17 5 19-32-13 3 17-30 15 30-12-3 18 32-16-5v20z" fill="#69747e"/>
    <path d="M564 372v-15l-13 4 15-26-10 2 13-23 12 23-9-2 14 26-12-4v15z" fill="#77828c"/>
  </g>
  <!-- flag stripes -->
  <g fill="#b3202e">
    <path d="M56 200h192l-24 26H82z"/>
    <path d="M94 244h150l-24 26H120z"/>
    <path d="M132 288h108l-24 26H158z"/>
  </g>
  <!-- navy triangle field with star -->
  <path d="M284 176v196H126z" fill="#12294a"/>
  <path d="M248 268l7.6 15.4 17 2.5-12.3 12 2.9 16.9-15.2-8-15.2 8 2.9-16.9-12.3-12 17-2.5z" fill="#fff"/>
  <!-- chimney -->
  <path d="M298 92h44v68l-44 30z" fill="#12294a"/>
  <!-- saluting soldier -->
  <g fill="#12294a" transform="translate(4,24) scale(0.97)" transform-origin="462 300">
    <path d="M426 186c2-17 17-28 36-28s34 11 36 28c1 6-3 9-9 9h-54c-6 0-10-3-9-9z"/>
    <path d="M436 199h52c0 23-11 38-26 38s-26-15-26-38z"/>
    <path d="M438 196 362 217c-9 2.5-13 9-11 16s10 10 18 8l78-22z"/>
    <path d="M400 372c0-82 19-136 62-136s62 54 62 136z"/>
    <path d="M448 230h28v30h-28z"/>
  </g>
  <!-- attic window -->
  <g fill="#12294a">
    <rect x="366" y="132" width="25" height="25"/>
    <rect x="399" y="132" width="25" height="25"/>
    <rect x="366" y="165" width="25" height="25"/>
    <rect x="399" y="165" width="25" height="25"/>
  </g>
  <!-- roof (on top) -->
  <path d="M240 224 390 74 546 230" fill="none" stroke="#12294a" stroke-width="27" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- wordmark -->
  <g font-family="Inter, 'Arial Black', Arial, sans-serif" text-anchor="middle" font-weight="900">
    <text x="330" y="500" font-size="112" letter-spacing="2" fill="#12294a">HER<tspan fill="none">O</tspan>ES</text>
    <circle cx="362" cy="461" r="40" fill="none" stroke="#12294a" stroke-width="18"/>
    <path d="M362 436l8.6 17.4 19.2 2.8-13.9 13.6 3.3 19.1-17.2-9-17.2 9 3.3-19.1-13.9-13.6 19.2-2.8z" fill="#12294a"/>
    <text x="330" y="586" font-size="60" letter-spacing="8" fill="#b3202e">HOME NETWORK</text>
  </g>
